services:
  postgres:
    image: postgres:16-alpine
    container_name: ocg-postgres
    restart: unless-stopped
    environment:
      # This is the cluster superuser, used for administration only.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: omni_cyber_guard
    ports:
      - "5432:5432"
    volumes:
      - ocg_postgres_data:/var/lib/postgresql/data
      # Creates the non-superuser application role. PostgreSQL exempts
      # superusers from row-level security silently, so the application must
      # never connect as one — see deploy/postgres-init/01-application-role.sql.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omni_cyber_guard"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ocg-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ocg-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://ocg_app:ocg_password@postgres:5432/omni_cyber_guard
      REDIS_URL: redis://redis:6379/0
      OVERRIDE_LOCAL_IP: ${OVERRIDE_LOCAL_IP:-}
      # Packet capture runs in the worker, which has CAP_NET_RAW. The API reads
      # the events the worker recorded from Redis.
      ENABLE_PASSIVE_MONITOR: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cap_drop:
      - ALL
    volumes:
      - ./backend:/app

  worker:
    build: ./backend
    container_name: ocg-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://ocg_app:ocg_password@postgres:5432/omni_cyber_guard
      REDIS_URL: redis://redis:6379/0
      OVERRIDE_LOCAL_IP: ${OVERRIDE_LOCAL_IP:-}
      ENABLE_PASSIVE_MONITOR: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Network scans (nmap host/OS discovery) need raw-socket access. These
    # capabilities only permit crafting/reading raw packets on networks this
    # container can already reach — they do not grant host-level access.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # IMPORTANT (Linux hosts only): by default this container only sees the
    # isolated Docker bridge network, NOT your physical LAN. To scan your
    # actual home/office network (e.g. 192.168.1.0/24), uncomment the line
    # below — this only works on native Linux Docker hosts. Docker Desktop
    # on Windows/Mac does not support host networking reliably; on those
    # platforms, run the worker natively instead (see README "Scanning your
    # real LAN on Windows/Mac").
    # network_mode: host

  # Celery beat — the scheduler.
  #
  # Without this service NOTHING on a timetable runs: no CVE/EPSS/KEV
  # synchronisation, no scheduled scans, no nightly exposure snapshots, no
  # exposure-graph rebuilds, no risk-acceptance expiry. The worker alone only
  # consumes jobs that something else enqueues, so the entire beat_schedule in
  # app/core/celery_app.py was dead configuration in this deployment.
  #
  # It runs as its own service rather than as `worker -B` so that scaling the
  # worker to more than one replica cannot start a second scheduler and fire
  # every scheduled job twice.
  beat:
    build: ./backend
    container_name: ocg-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info --pidfile=
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://ocg_app:ocg_password@postgres:5432/omni_cyber_guard
      REDIS_URL: redis://redis:6379/0
      # The scheduler only enqueues; it never captures packets.
      ENABLE_PASSIVE_MONITOR: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cap_drop:
      - ALL
    volumes:
      - ./backend:/app

  frontend:
    # NEXT_PUBLIC_API_BASE_URL has to be a BUILD argument, not a runtime
    # environment variable. Next.js inlines every NEXT_PUBLIC_* value into the
    # client JavaScript when `next build` runs, so setting it under
    # `environment:` here had no effect whatsoever — the browser used whatever
    # was baked in at image-build time, which was the fallback in lib/api.ts.
    #
    # Change OCG_PUBLIC_API_BASE_URL (in your .env or your shell) to the
    # address your browsers will use, then rebuild:
    #
    #   OCG_PUBLIC_API_BASE_URL=https://ocg.example.com/api/v1 \
    #     docker compose build frontend
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${OCG_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: ocg-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  ocg_postgres_data:
